services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    command: >
      sh -c "uvicorn src.app:app --host 0.0.0.0 --port 8000 --reload"

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    ports:
      - "8501:8501"
    command: >
      sh -c "streamlit run ui/streamlit_ui.py --server.address 0.0.0.0 --server.port 8501"
